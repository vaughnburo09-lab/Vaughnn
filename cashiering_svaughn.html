<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cashiering System</title>
<style>
:root{--bg:#eef2f0;--card:#fff;--ink:#1c2b27;--muted:#5d6f69;--line:#d5dedb;--green:#1f6f5b;--green-d:#15523f;--red:#b3362f;--gold:#fff1c2;--gold-ink:#5a4300}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;line-height:1.45}
.pos{max-width:820px;margin:0 auto;padding:16px}
.store{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;background:var(--green);color:#fff;padding:18px 20px;border-radius:10px;margin-bottom:14px}
.store h1{margin:0 0 4px;font-size:1.5rem}
.store p{margin:0;opacity:.9}
.store label{color:#fff}
.store input{background:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.05rem}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink);width:100%}
input:focus,.btn:focus-visible{outline:3px solid #8fd0bd;outline-offset:1px}
.entry{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end}
.btn{font:inherit;font-weight:700;padding:10px 16px;border:1px solid var(--green);background:#fff;color:var(--green);border-radius:6px;cursor:pointer}
.btn:hover{background:#e3f1ec}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-d)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:#fbe9e7}
.msg{margin:8px 0 0;color:var(--red);font-weight:600;min-height:1.2em}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.85rem;color:var(--muted)}
.num{text-align:right}
.empty td{text-align:center;color:var(--muted);padding:22px}
.rm{border:0;background:none;color:var(--red);font-weight:700;cursor:pointer;font-size:1.1rem}
.pay{display:grid;gap:12px}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--gold);color:var(--gold-ink);padding:14px 16px;border-radius:8px;border-left:6px solid #e0a800}
.total strong{font-size:2rem}
.change{display:flex;justify-content:space-between;font-size:1.2rem}
.change strong.low{color:var(--red)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.saved{margin:0;color:var(--green);font-weight:600;min-height:1.2em}
@media(max-width:600px){.entry{grid-template-columns:1fr 1fr}.entry label:first-child,.entry .btn{grid-column:1/-1}.actions .btn{flex:1 1 100%}}
</style>
</head>
<body>
<main class="pos">
  <header class="store">
    <div>
      <h1 id="storeName">Sampaguita General Store</h1>
      <p>Transaction <strong id="txnId">TXN-001</strong> · <span id="txnDate"></span></p>
    </div>
    <label>Cashier
      <input type="text" id="cashier" value="Juan Dela Cruz">
    </label>
  </header>

  <section class="panel">
    <h2>Add item</h2>
    <div class="entry">
      <label>Product name <input type="text" id="product" placeholder="e.g. Notebook"></label>
      <label>Quantity <input type="number" id="qty" min="1" step="1" value="1"></label>
      <label>Unit price (₱) <input type="number" id="price" min="0" step="0.01" placeholder="0.00"></label>
      <button id="addBtn" class="btn primary">Add Item</button>
    </div>
    <p id="msg" class="msg" role="alert"></p>
  </section>

  <section class="panel">
    <h2>Transaction</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Subtotal</th><th></th></tr></thead>
        <tbody id="items"><tr class="empty"><td colspan="5">No items yet. Add a product above.</td></tr></tbody>
      </table>
    </div>
  </section>

  <section class="panel pay">
    <div class="total"><span>Total amount</span><strong id="total">₱0.00</strong></div>
    <label>Cash received (₱) <input type="number" id="cash" min="0" step="0.01" placeholder="0.00"></label>
    <div class="change"><span>Change</span><strong id="change">₱0.00</strong></div>
    <div class="actions">
      <button id="completeBtn" class="btn primary">Complete Transaction</button>
      <button id="exportBtn" class="btn">Export to CSV</button>
      <button id="clearBtn" class="btn danger">Clear Transaction</button>
    </div>
    <p id="saved" class="saved"></p>
  </section>
</main>
<script>
// ---- State ----
let items = [];          // current cart
let records = [];        // completed transactions (kept in memory for export)
let txnCounter = 1;

const $ = id => document.getElementById(id);
const peso = n => "₱" + n.toFixed(2);
const txnId = () => "TXN-" + String(txnCounter).padStart(3, "0");
const today = () => new Date().toISOString().slice(0, 10);
const total = () => items.reduce((s, i) => s + i.qty * i.price, 0);

function showMsg(text) { $("msg").textContent = text; }

// ---- Add item with validation ----
function addItem() {
  const name = $("product").value.trim();
  const qty = parseInt($("qty").value, 10);
  const price = parseFloat($("price").value);
  if (!name) return showMsg("Enter a product name.");
  if (!Number.isInteger(qty) || qty < 1) return showMsg("Quantity must be a whole number of 1 or more.");
  if (isNaN(price) || price < 0) return showMsg("Enter a valid unit price (0 or more).");
  showMsg("");
  $("saved").textContent = "";
  items.push({ name, qty, price });
  $("product").value = ""; $("qty").value = 1; $("price").value = "";
  $("product").focus();
  render();
}

function removeItem(i) { items.splice(i, 1); render(); }

// ---- Render table and payment ----
function render() {
  const body = $("items");
  if (!items.length) {
    body.innerHTML = '<tr class="empty"><td colspan="5">No items yet. Add a product above.</td></tr>';
  } else {
    body.innerHTML = "";
    items.forEach((it, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td></td><td class="num">${it.qty}</td><td class="num">${peso(it.price)}</td>` +
        `<td class="num">${peso(it.qty * it.price)}</td>` +
        `<td><button class="rm" title="Remove item" aria-label="Remove item">×</button></td>`;
      tr.children[0].textContent = it.name;   // safe text insertion
      tr.querySelector(".rm").onclick = () => removeItem(i);
      body.appendChild(tr);
    });
  }
  $("total").textContent = peso(total());
  updateChange();
  $("txnId").textContent = txnId();
}

function updateChange() {
  const cash = parseFloat($("cash").value);
  const change = isNaN(cash) ? 0 : cash - total();
  $("change").textContent = peso(Math.max(change, 0));
  $("change").classList.toggle("low", !isNaN(cash) && change < 0);
}

// ---- Complete transaction ----
function completeTransaction() {
  if (!items.length) return showMsg("Add at least one item first.");
  const cash = parseFloat($("cash").value);
  if (isNaN(cash) || cash < 0) return showMsg("Enter the cash received.");
  if (cash < total()) return showMsg("Cash received is less than the total amount.");
  records.push({
    id: txnId(), date: today(), cashier: $("cashier").value.trim(),
    items: items.map(i => ({ ...i })), total: total(), cash, change: cash - total()
  });
  $("saved").textContent = `${txnId()} saved. Change: ${peso(cash - total())}. Click Export to CSV to download.`;
  txnCounter++;
  items = []; $("cash").value = ""; showMsg("");
  render();
}

// ---- Clear ----
function clearTransaction() {
  items = []; $("cash").value = ""; showMsg(""); $("saved").textContent = "";
  render();
}

// ---- CSV export ----
const csvCell = v => {
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};

function exportCSV() {
  if (!records.length) return showMsg("No completed transactions to export. Click Complete Transaction first.");
  showMsg("");
  const rows = [["Transaction ID", "Date", "Product", "Quantity", "Unit Price", "Subtotal"]];
  records.forEach(r => r.items.forEach(i =>
    rows.push([r.id, r.date, i.name, i.qty, i.price.toFixed(2), (i.qty * i.price).toFixed(2)])));
  rows.push([]);
  rows.push(["Transaction Summary"]);
  rows.push(["Transaction ID", "Date", "Cashier", "Total Amount", "Cash Received", "Change"]);
  records.forEach(r => rows.push([r.id, r.date, r.cashier, r.total.toFixed(2), r.cash.toFixed(2), r.change.toFixed(2)]));

  const csv = rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  // BOM (\uFEFF) helps Excel read the file correctly
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "transactions_" + today() + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

// ---- Events ----
$("addBtn").onclick = addItem;
$("completeBtn").onclick = completeTransaction;
$("clearBtn").onclick = clearTransaction;
$("exportBtn").onclick = exportCSV;
$("cash").oninput = updateChange;
["product", "qty", "price"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") addItem(); }));
$("txnDate").textContent = today();
render();
</script>
</body>
</html>
